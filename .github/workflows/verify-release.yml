name: Verify published release anonymously

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published YYYY.MM.DD.X version (without v)'
        required: true
        type: string
      digest:
        description: 'Published multi-platform index sha256 digest'
        required: true
        type: string
      source_commit:
        description: 'Expected full source commit SHA in image labels'
        required: true
        type: string

permissions:
  contents: read

jobs:
  anonymous-pull:
    name: Anonymous native ${{ matrix.arch }} release pull
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      VERSION: ${{ inputs.version }}
      DIGEST: ${{ inputs.digest }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Pull immutable release without registry credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$ ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          case "$ARCH:$(uname -m)" in amd64:x86_64|arm64:aarch64) ;; *) exit 1 ;; esac
          image="ghcr.io/${GITHUB_REPOSITORY,,}@$DIGEST"
          anonymous_config=$(mktemp -d "$RUNNER_TEMP/sol-anonymous.XXXXXX")
          trap 'rm -rf -- "$anonymous_config"' EXIT
          docker --config "$anonymous_config" pull --platform "linux/$ARCH" "$image"
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "$ARCH"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image")" = "$VERSION"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$SOURCE_COMMIT"
          printf 'Anonymous linux/%s pull and source/version labels verified: `%s`\n' "$ARCH" "$image" >> "$GITHUB_STEP_SUMMARY"
